<!doctype html>

<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div
      th:fragment="representatives-picker(userRole, representatives)"
    >
      <link
        rel="stylesheet"
        th:href="@{/fragments/general-one-s-report-page-content/fragments/representatives-picker/representatives-picker.css}"
      />

      <!-- renderRepresentativesPicker -->
      <div
        id="adminView"
        th:if="${representatives}"
      >
        <div
          id="representativesFilter"
          class="representatives-picker__filter"
        >
          <h3 class="label">Представники</h3>
          <details class="representatives-picker__dropdown">
            <summary id="representativesSummary">
              Представники
            </summary>
            <div class="representatives-picker__dropdown-content">
              <p class="representatives-picker__helper">
                Оберіть представників, які мають відображатися у
                звіті.
              </p>

              <!-- optionsContainer -->
              <div
                id="representativesOptions"
                class="representatives-picker__options"
              >
                <label
                  th:each="representative, iterStat : ${representatives}"
                  th:for="${'representative-' + iterStat.index}"
                  class="representatives-option"
                >
                  <input
                    type="checkbox"
                    th:id="${'representative-' + iterStat.index}"
                    th:value="${representative}"
                    checked
                  />
                  <span th:text="${representative}"></span>
                </label>
              </div>

              <div class="representatives-picker__actions">
                <button
                  type="button"
                  class="representatives-picker__button"
                  id="representativesSelectAll"
                >
                  Обрати всі
                </button>

                <button
                  type="button"
                  class="representatives-picker__button"
                  id="representativesDeselectAll"
                >
                  Відмінити всі
                </button>
              </div>
            </div>
          </details>
        </div>
        <div
          id="adminTableContainer"
          class="admin-table-container"
          style="display: none"
        ></div>
        <div
          id="adminError"
          class="status error"
          style="display: none"
        ></div>
      </div>

      <script
        type="module"
        th:src="@{/fragments/general-one-s-report-page-content/fragments/representatives-picker/representatives-picker.js(v=${appVersion})}"
      ></script>
    </div>
  </body>
</html>
